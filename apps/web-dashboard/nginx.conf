# GeoSentinel-NER web dashboard — SPA + API reverse proxy config.
#
# The dashboard calls same-origin relative paths (mirroring vite.config.ts):
#   /api/...        -> api-gateway:8000   (REST + WebSocket /api/v1/ws/{id})
#   /weather/...    -> data-ingestion:8001 (Open-Meteo live layers)
#   /imd/...        -> data-ingestion:8001 (IMD nowcast layers)
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Basic hardening headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Never cache the HTML shell (hashed assets are cached by Vite fingerprints)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # WebSocket endpoint needs HTTP/1.1 upgrade headers, or realtime dies silently.
    location /api/v1/ws/ {
        proxy_pass http://api-gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://api-gateway:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /weather/ {
        proxy_pass http://data-ingestion:8001;
        proxy_set_header Host $host;
    }

    location /imd/ {
        proxy_pass http://data-ingestion:8001;
        proxy_set_header Host $host;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;
}
