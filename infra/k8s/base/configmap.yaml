apiVersion: v1
kind: ConfigMap
metadata:
  name: geosentinel-config
  namespace: geosentinel
data:
  APP_ENV: "production"
  APP_DEBUG: "false"
  LOG_LEVEL: "INFO"
  API_PREFIX: "/api/v1"
  CORS_ALLOW_ORIGINS: "https://geosentinel.in,https://dashboard.geosentinel.in"
  ALLOWED_HOSTS: "geosentinel.in,api.geosentinel.in,localhost,127.0.0.1"
  DATABASE_URL: "postgresql+asyncpg://geosentinel_admin:$(DB_PASSWORD)@postgres:5432/geosentinel"
  TIMESCALE_URL: "postgresql+asyncpg://geosentinel_admin:$(DB_PASSWORD)@timescaledb:5432/geosentinel_ts"
  REDIS_URL: "redis://redis:6379/0"
  MINIO_ENDPOINT: "minio:9000"
  MINIO_SECURE: "false"
  MINIO_BUCKET: "geosentinel"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  KAFKA_CONSUMER_GROUP: "geosentinel-cluster"
  ENABLE_KAFKA: "true"
  OPEN_METEO_BASE_URL: "https://api.open-meteo.com/v1"
  WEATHER_PROVIDER: "open-meteo"
  DEFAULT_LANGUAGE: "en"
  SUPPORTED_LANGUAGES: "en,hi,as,bn,bo,mni,lus,kha,grt,ne"
  ALERT_RAINFALL_THRESHOLD_MM: "50.0"
  ALERT_FORECAST_RAINFALL_THRESHOLD_MM: "75.0"
  ALERT_LANDSLIDE_PROBABILITY_THRESHOLD: "0.70"
  NORTHEAST_DIGEST_ENABLED: "true"
  NORTHEAST_DIGEST_INTERVAL_MINUTES: "30"
  ENABLE_CV_TRIAGE: "true"
  ENABLE_CAP_ALERTS: "true"
  DATA_INGESTION_URL: "http://data-ingestion:8001"
  TILE_SERVER_URL: "http://titiler:8000"
