apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-ingestion
  namespace: geosentinel
  labels:
    app: data-ingestion
spec:
  replicas: 2
  selector:
    matchLabels:
      app: data-ingestion
  template:
    metadata:
      labels:
        app: data-ingestion
    spec:
      containers:
        - name: data-ingestion
          image: geosentinel/data-ingestion:latest
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: geosentinel-config
            - secretRef:
                name: geosentinel-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: data-ingestion
  namespace: geosentinel
  labels:
    app: data-ingestion
spec:
  type: ClusterIP
  ports:
    - port: 8001
      targetPort: 8001
      name: http
  selector:
    app: data-ingestion
