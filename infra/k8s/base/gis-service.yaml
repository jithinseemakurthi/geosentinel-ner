apiVersion: apps/v1
kind: Deployment
metadata:
  name: gis-service
  namespace: geosentinel
  labels:
    app: gis-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gis-service
  template:
    metadata:
      labels:
        app: gis-service
    spec:
      containers:
        - name: gis-service
          image: geosentinel/gis-service:latest
          ports:
            - containerPort: 8004
          envFrom:
            - configMapRef:
                name: geosentinel-config
            - secretRef:
                name: geosentinel-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gis-service
  namespace: geosentinel
  labels:
    app: gis-service
spec:
  type: ClusterIP
  ports:
    - port: 8004
      targetPort: 8004
      name: http
  selector:
    app: gis-service
