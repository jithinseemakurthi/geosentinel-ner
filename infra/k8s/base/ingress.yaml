apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: geosentinel-ingress
  namespace: geosentinel
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - geosentinel.in
        - api.geosentinel.in
      secretName: geosentinel-tls
  rules:
    - host: geosentinel.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-dashboard
                port:
                  number: 80
    - host: api.geosentinel.in
      http:
        paths:
          - path: /api/v1/notifications/whatsapp/webhook
            pathType: Prefix
            backend:
              service:
                name: notification-service
                port:
                  number: 8006
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8000
