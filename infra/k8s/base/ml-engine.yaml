apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-engine
  namespace: geosentinel
  labels:
    app: ml-engine
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ml-engine
  template:
    metadata:
      labels:
        app: ml-engine
    spec:
      containers:
        - name: ml-engine
          image: geosentinel/ml-engine:latest
          ports:
            - containerPort: 8002
          envFrom:
            - configMapRef:
                name: geosentinel-config
            - secretRef:
                name: geosentinel-secrets
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ml-engine
  namespace: geosentinel
  labels:
    app: ml-engine
spec:
  type: ClusterIP
  ports:
    - port: 8002
      targetPort: 8002
      name: http
  selector:
    app: ml-engine
