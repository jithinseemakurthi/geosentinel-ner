apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-external-db
  namespace: geosentinel
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - api-gateway
                  - data-ingestion
                  - ml-engine
                  - alert-engine
                  - gis-service
                  - report-service
                  - notification-service
      ports:
        - protocol: TCP
          port: 5432
