apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: geosentinel
  labels:
    app: notification-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: geosentinel/notification-service:latest
          ports:
            - containerPort: 8006
          envFrom:
            - configMapRef:
                name: geosentinel-config
            - secretRef:
                name: geosentinel-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8006
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: geosentinel
  labels:
    app: notification-service
spec:
  type: ClusterIP
  ports:
    - port: 8006
      targetPort: 8006
      name: http
  selector:
    app: notification-service
