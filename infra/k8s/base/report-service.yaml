apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-service
  namespace: geosentinel
  labels:
    app: report-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: report-service
  template:
    metadata:
      labels:
        app: report-service
    spec:
      containers:
        - name: report-service
          image: geosentinel/report-service:latest
          ports:
            - containerPort: 8005
          envFrom:
            - configMapRef:
                name: geosentinel-config
            - secretRef:
                name: geosentinel-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: report-service
  namespace: geosentinel
  labels:
    app: report-service
spec:
  type: ClusterIP
  ports:
    - port: 8005
      targetPort: 8005
      name: http
  selector:
    app: report-service
