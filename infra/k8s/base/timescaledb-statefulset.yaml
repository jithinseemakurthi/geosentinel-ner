apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: timescaledb
  namespace: geosentinel
spec:
  serviceName: timescaledb
  replicas: 1
  selector:
    matchLabels:
      app: timescaledb
  template:
    metadata:
      labels:
        app: timescaledb
    spec:
      containers:
        - name: timescaledb
          image: timescale/timescaledb:2.17.2-pg16
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: geosentinel_ts
            - name: POSTGRES_USER
              value: geosentinel_admin
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: geosentinel-secrets
                  key: DB_PASSWORD
          volumeMounts:
            - name: ts-storage
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: ts-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: timescaledb
  namespace: geosentinel
spec:
  type: ClusterIP
  ports:
    - port: 5432
      name: postgres
  selector:
    app: timescaledb
