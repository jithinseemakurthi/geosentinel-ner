# =============================================================================
# GeoSentinel-NER Prometheus configuration
# =============================================================================
global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    cluster: geosentinel-local

scrape_configs:
  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Application services (FastAPI /metrics endpoints).
  # Targets use compose service DNS names on the geosentinel-net network.
  - job_name: api-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["api-gateway:8000"]

  - job_name: data-ingestion
    metrics_path: /metrics
    static_configs:
      - targets: ["data-ingestion:8001"]

  - job_name: ml-engine
    metrics_path: /metrics
    static_configs:
      - targets: ["ml-engine:8002"]

  - job_name: alert-engine
    metrics_path: /metrics
    static_configs:
      - targets: ["alert-engine:8003"]

  - job_name: gis-service
    metrics_path: /metrics
    static_configs:
      - targets: ["gis-service:8004"]

  - job_name: report-service
    metrics_path: /metrics
    static_configs:
      - targets: ["report-service:8005"]

  - job_name: notification-service
    metrics_path: /metrics
    static_configs:
      - targets: ["notification-service:8006"]
