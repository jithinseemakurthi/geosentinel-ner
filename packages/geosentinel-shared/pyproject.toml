[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "geosentinel-shared"
version = "0.1.0"
description = "Shared configuration, auth, DB, logging, and Pydantic schemas for GeoSentinel-NER services."
authors = ["GeoSentinel Team"]
packages = [{include = "geosentinel_shared"}]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.6"
pydantic-settings = "^2.2"
python-dotenv = "^1.0"
asyncpg = "^0.29"
sqlalchemy = {extras = ["asyncio"], version = "^2.0"}
geoalchemy2 = "^0.15"
shapely = "^2.0"
structlog = "^24.1"
python-json-logger = "^2.0"
passlib = {extras = ["bcrypt"], version = "^1.7"}
python-jose = {extras = ["cryptography"], version = "^3.3"}
email-validator = "^2.1"
geojson = "^2.5"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Focused rule set shared across the repo (see root pyproject.toml).
select = ["E", "W", "F", "I"]
