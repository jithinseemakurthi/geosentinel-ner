[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "geosentinel-api-gateway"
version = "0.1.0"
description = "GeoSentinel-NER API Gateway"
authors = ["GeoSentinel Team"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
geosentinel-shared = {path = "../../packages/geosentinel-shared"}
fastapi = "^0.109"
uvicorn = {extras = ["standard"], version = "^0.27"}
gunicorn = "^21.2"
pydantic = "^2.6"
pydantic-settings = "^2.2"
python-dotenv = "^1.0"
asyncpg = "^0.29"
sqlalchemy = {extras = ["asyncio"], version = "^2.0"}
alembic = "^1.13"
geoalchemy2 = "^0.15"
shapely = "^2.0"
pyproj = "^3.6"
redis = "^5.0"
httpx = "^0.26"
tenacity = "^8.2"
structlog = "^24.1"
python-json-logger = "^2.0"
prometheus-client = "^0.19"
opentelemetry-api = "^1.22"
opentelemetry-sdk = "^1.22"
opentelemetry-exporter-otlp = "^1.22"
opentelemetry-instrumentation-fastapi = "^0.43"
opentelemetry-instrumentation-sqlalchemy = "^0.43"
opentelemetry-instrumentation-redis = "^0.43"
email-validator = "^2.1"
passlib = {extras = ["bcrypt"], version = "^1.7"}
python-jose = {extras = ["cryptography"], version = "^3.3"}
python-multipart = "^0.0.6"
jinja2 = "^3.1"
orjson = "^3.9"
msgspec = "^0.18"
minio = "^7.2"
boto3 = "^1.34"
celery = "^5.3"
flower = "^2.0"
slowapi = "^0.1.9"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
pytest-asyncio = "^0.23"
pytest-cov = "^4.1"
pytest-mock = "^3.12"
httpx = "^0.26"
ruff = "^0.3"
mypy = "^1.8"
black = "^23.12"
pre-commit = "^3.6"

[tool.poetry.group.test.dependencies]
pytest = "^7.4"
pytest-asyncio = "^0.23"
pytest-cov = "^4.1"
pytest-mock = "^3.12"
httpx = "^0.26"
faker = "^24.0"
factory-boy = "^3.3"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Focused rule set shared across the repo (see root pyproject.toml).
select = ["E", "W", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106", "PLR2004"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"