[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "geosentinel-gis-service"
version = "0.1.0"
description = "GeoSentinel-NER GIS Service - Spatial queries and vector tiles"
authors = ["GeoSentinel Team"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
geosentinel-shared = {path = "../../packages/geosentinel-shared"}
fastapi = "^0.109"
uvicorn = {extras = ["standard"], version = "^0.27"}
pydantic = "^2.6"
pydantic-settings = "^2.2"
python-dotenv = "^1.0"
asyncpg = "^0.29"
sqlalchemy = {extras = ["asyncio"], version = "^2.0"}
geoalchemy2 = "^0.15"
shapely = "^2.0"
pyproj = "^3.6"
redis = "^5.0"
httpx = "^0.26"
tenacity = "^8.2"
structlog = "^24.1"
python-json-logger = "^2.0"
prometheus-client = "^0.19"
opentelemetry-api = "^1.22"
opentelemetry-sdk = "^1.22"
opentelemetry-exporter-otlp = "^1.22"
opentelemetry-instrumentation-fastapi = "0.43b0"
orjson = "^3.9"
msgspec = "^0.18"
minio = "^7.2"
boto3 = "^1.34"
# GIS note: raster tiling is delegated to the TiTiler container over HTTP
# (see docker-compose.yml). titiler/rasterio pin pydantic <2 and would
# conflict with the shared package, so they are deliberately NOT deps here.

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
pytest-asyncio = "^0.23"
pytest-cov = "^4.1"
pytest-mock = "^3.12"
httpx = "^0.26"
ruff = "^0.3"
mypy = "^1.8"
black = "^23.12"
pre-commit = "^3.6"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Focused rule set shared across the repo (see root pyproject.toml).
select = ["E", "W", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true