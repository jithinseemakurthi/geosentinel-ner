[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "geosentinel-ml-engine"
version = "0.1.0"
description = "GeoSentinel-NER ML Engine - Model Inference Service"
authors = ["GeoSentinel Team"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
geosentinel-shared = {path = "../../packages/geosentinel-shared"}
fastapi = "^0.109"
uvicorn = {extras = ["standard"], version = "^0.27"}
pydantic = "^2.6"
pydantic-settings = "^2.2"
python-dotenv = "^1.0"
asyncpg = "^0.29"
sqlalchemy = {extras = ["asyncio"], version = "^2.0"}
geoalchemy2 = "^0.15"
shapely = "^2.0"
pyproj = "^3.6"
redis = "^5.0"
httpx = "^0.26"
tenacity = "^8.2"
structlog = "^24.1"
python-json-logger = "^2.0"
prometheus-client = "^0.19"
opentelemetry-api = "^1.22"
opentelemetry-sdk = "^1.22"
opentelemetry-exporter-otlp = "^1.22"
opentelemetry-instrumentation-fastapi = "^0.43"
orjson = "^3.9"
msgspec = "^0.18"
minio = "^7.2"
boto3 = "^1.34"
celery = "^5.3"
flower = "^2.0"

# ML specific
numpy = "^1.26"
pandas = "^2.2"
scikit-learn = "^1.4"
xgboost = "^2.1"
lightgbm = "^4.3"
torch = {extras = ["cpu"], version = "^2.2"}
torchvision = "^0.17"
mlflow = "^2.11"
joblib = "^1.4"
geopandas = "^0.14"
rasterio = "^1.3"
rioxarray = "^0.15"
shap = "^0.44"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
pytest-asyncio = "^0.23"
pytest-cov = "^4.1"
pytest-mock = "^3.12"
httpx = "^0.26"
ruff = "^0.3"
mypy = "^1.8"
black = "^23.12"
pre-commit = "^3.6"
jupyter = "^1.0"
ipykernel = "^6.29"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Focused rule set shared across the repo (see root pyproject.toml).
select = ["E", "W", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true